<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Gems Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom animation for the vinyl spin */
    @keyframes spin-slow {
      100% {
        transform: rotate(360deg);
      }
    }
    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }
    
    /* A cool glowing effect behind the record */
    .glow {
      box-shadow: 0 0 80px 20px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Background ambient light -->
  <div class="absolute top-1/3 left-1/4 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>
  <div class="absolute bottom-1/3 right-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse"></div>

  <!-- Main Glass Card -->
  <div class="relative z-10 p-10 md:p-16 rounded-3xl bg-white/5 border border-white/10 backdrop-blur-xl flex flex-col md:flex-row items-center gap-12 max-w-4xl w-full mx-4 shadow-2xl">
    
    <!-- Vinyl Record Container -->
    <div class="relative w-64 h-64 md:w-80 md:h-80 flex-shrink-0">
      <!-- Glow behind record -->
      <div class="absolute inset-0 rounded-full glow"></div>
      
      <!-- The spinning vinyl -->
      <div class="w-full h-full rounded-full bg-black border-[8px] border-gray-800 animate-spin-slow relative flex items-center justify-center shadow-[inset_0_0_20px_rgba(255,255,255,0.2)]">
        <!-- Vinyl grooves -->
        <div class="absolute inset-4 rounded-full border border-gray-700/50"></div>
        <div class="absolute inset-8 rounded-full border border-gray-700/50"></div>
        <div class="absolute inset-12 rounded-full border border-gray-700/50"></div>
        <div class="absolute inset-16 rounded-full border border-gray-700/50"></div>
        <div class="absolute inset-20 rounded-full border border-gray-700/50"></div>
        
        <!-- Center Label -->
        <div class="w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-purple-600 to-pink-500 rounded-full flex items-center justify-center z-10 shadow-inner">
          <!-- Center hole -->
          <div class="w-3 h-3 bg-gray-950 rounded-full shadow-inner"></div>
        </div>
      </div>
    </div>

    <!-- Text Content -->
    <div class="flex-1 text-center md:text-left z-10">
      <span class="px-3 py-1 text-xs font-semibold tracking-wider text-purple-300 uppercase bg-purple-900/30 rounded-full border border-purple-500/30">
        Now Spinning
      </span>
      <h1 class="text-4xl md:text-6xl font-extrabold mt-6 mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
        Hidden Gems Music
      </h1>
      <p class="text-gray-400 text-lg mb-8 max-w-md">
        Finding songs you won't hear on the radio. Curated deep cuts, underground vibes, and tracks the algorithms miss.
      </p>

      <!-- Button -->
      <button class="px-8 py-3 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.3)]">
        Connect Spotify
      </button>
    </div>

  </div>

</body>
</html>
