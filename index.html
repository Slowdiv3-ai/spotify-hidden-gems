<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Gems Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030303;
      color: white;
      margin: 0;
      overflow-x: hidden;
    }

    .aurora-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      animation: float 20s infinite alternate ease-in-out;
    }

    .orb-1 { width: 600px; height: 600px; background: #6d28d9; top: -10%; left: -10%; animation-delay: 0s; }
    .orb-2 { width: 500px; height: 500px; background: #2563eb; bottom: -10%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 400px; height: 400px; background: #db2777; top: 40%; left: 40%; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(100px, 50px) scale(1.1); }
      100% { transform: translate(-50px, 150px) scale(0.9); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <div class="aurora-container">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <nav class="w-full flex justify-between items-center px-8 py-6 relative z-10 border-b border-white/10 bg-black/20 backdrop-blur-md">
    <div class="text-xl font-bold tracking-tighter flex items-center gap-2">
      <svg class="w-6 h-6 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
      HIDDEN GEMS
    </div>
    <div class="hidden md:flex gap-8 text-sm text-gray-300 font-medium">
      <a href="#" class="hover:text-white transition">Discover</a>
      <a href="#" class="hover:text-white transition">Library</a>
      <a href="#" class="hover:text-white transition">Pricing</a>
    </div>
    <button class="px-5 py-2 rounded-full border border-white/20 text-sm font-medium hover:bg-white/10 transition backdrop-blur-sm">
      Log In
    </button>
  </nav>

  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 relative z-10 pt-20 pb-20">
    
    <span class="inline-block px-3 py-1 text-xs font-semibold tracking-wider text-purple-300 uppercase bg-purple-900/30 rounded-full border border-purple-500/30 mb-8 backdrop-blur-sm">
      The anti-algorithm music engine
    </span>

    <h1 class="text-5xl md:text-7xl font-bold max-w-4xl tracking-tight leading-tight mb-6">
      Find the music <br />
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">
        algorithms hide from you.
      </span>
    </h1>

    <p class="text-gray-400 text-lg md:text-xl max-w-2xl mb-10">
      Curated deep cuts, underground vibes, and tracks you won't hear on the radio. Paste a vibe, get a playlist.
    </p>


    <!-- The Search Inputs -->
    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-2xl mx-auto backdrop-blur-md bg-white/5 p-2 rounded-2xl border border-white/10 shadow-lg">
      <input type="text" id="search-artist" placeholder="Artist (e.g. Tame Impala)" class="flex-1 bg-transparent text-white placeholder-gray-400 px-4 py-3 rounded-xl outline-none focus:ring-1 focus:ring-purple-500 transition-all">
      <input type="text" id="search-track" placeholder="Song (e.g. Let It Happen)" class="flex-1 bg-transparent text-white placeholder-gray-400 px-4 py-3 rounded-xl outline-none focus:ring-1 focus:ring-purple-500 transition-all">
      <button id="spin-btn" onclick="generatePlaylist()" class="px-8 py-3 bg-white text-black font-semibold rounded-xl hover:bg-gray-200 transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)] disabled:opacity-50 disabled:cursor-not-allowed">
        Dig
      </button>
    </div>

    <div id="result-view" class="hidden mt-12 w-full max-w-2xl backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-6 text-left shadow-2xl">
      <h2 class="text-xl font-semibold mb-4 text-white">Your 5 Hidden Gems:</h2>
      <ul id="song-list" class="space-y-2 text-gray-300">
        <!-- Songs go here -->
      </ul>
    </div>

  </main>

    <script>
    // 1. YOUR API KEY
    const LASTFM_API_KEY = '8558552f0e24e9a4188576a7d8a36c91'; // <--- Make sure your key is here!

    async function generatePlaylist() {
      const btn = document.getElementById('spin-btn');
      const resultView = document.getElementById('result-view');
      const listContainer = document.getElementById('song-list');
      
      const seedArtist = document.getElementById('search-artist').value.trim();
      const seedTrack = document.getElementById('search-track').value.trim();

      // If the user leaves it blank, default to Tame Impala
      const finalArtist = seedArtist || 'Tame Impala';
      const finalTrack = seedTrack || 'The Less I Know The Better';

      // Show loading state
      btn.innerText = "Digging...";
      btn.disabled = true;
      resultView.classList.remove('hidden');
      listContainer.innerHTML = `<li class="text-gray-400 p-3 animate-pulse">Searching the underground...</li>`;

      try {
        const url = `https://ws.audioscrobbler.com/2.0/?method=track.getsimilar&artist=${encodeURIComponent(finalArtist)}&track=${encodeURIComponent(finalTrack)}&api_key=${LASTFM_API_KEY}&format=json&limit=8`;

        const response = await fetch(url);
        const data = await response.json();

        // Check if Last.fm actually gave us tracks
        if (data.similartracks && data.similartracks.track) {
          const tracks = data.similartracks.track;
          listContainer.innerHTML = '';

          tracks.slice(0, 5).forEach(track => {
            const li = document.createElement('li');
            // Added flexbox and hover effects to fit the album art
            li.className = "p-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 transition flex items-center gap-4 group cursor-pointer";
            
            let artistName = "Unknown Artist";
            if (track.artist) {
              if (typeof track.artist === 'string') artistName = track.artist;
              else if (track.artist.name) artistName = track.artist.name;
              else if (track.artist['#text']) artistName = track.artist['#text'];
            }

            const trackName = track.name || "Unknown Track";

            // GET THE ALBUM ART (Fallback to a blank grey square if none exists)
            let imageUrl = "https://via.placeholder.com/100/333333/ffffff?text=No+Art";
            if (track.image && track.image.length > 0) {
              // Last.fm returns multiple sizes. We want the 'large' one.
              const largeImage = track.image.find(img => img.size === 'large');
              if (largeImage && largeImage['#text']) imageUrl = largeImage['#text'];
            }

            li.innerHTML = `
              <img src="${imageUrl}" alt="Album Art" class="w-16 h-16 rounded-md object-cover shadow-lg group-hover:scale-105 transition-transform">
              <div class="flex flex-col">
                <span class="text-white font-semibold text-lg line-clamp-1">${trackName}</span>
                <span class="text-gray-400 text-sm line-clamp-1">${artistName}</span>
              </div>
            `;
            listContainer.appendChild(li);
          });
          
          btn.innerText = "Dig Again";
        } else {
          // If the API responded but had no similar tracks
          listContainer.innerHTML = `
            <li class="p-4 bg-red-900/20 border border-red-500/30 rounded-xl text-red-200">
              <p class="font-bold mb-1">No similar tracks found for "${finalTrack}".</p>
              <p class="text-sm text-red-300/80">Last.fm's underground database is weird. Try an indie song, or check the spelling!</p>
            </li>`;
          btn.innerText = "Try Again";
        }
      } catch (error) {
        // If the API totally broke (e.g., bad internet, bad API key)
        console.error(error);
        listContainer.innerHTML = `
            <li class="p-4 bg-red-900/20 border border-red-500/30 rounded-xl text-red-200">
              <p class="font-bold mb-1">API Error.</p>
              <p class="text-sm text-red-300/80">Check your internet connection or make sure your Last.fm API key is correct.</p>
            </li>`;
        btn.innerText = "Error";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
