<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Gems Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Import a cleaner font for that premium look */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: white;
      margin: 0;
      overflow-x: hidden;
    }

    /* The container for the 3D wave background */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative">

  <!-- 3D Particle Background -->
  <div id="canvas-container"></div>

  <!-- Top Navigation Bar (like the Qronos design) -->
  <nav class="w-full flex justify-between items-center px-8 py-6 relative z-10 border-b border-white/10 backdrop-blur-md bg-black/20">
    <div class="text-xl font-bold tracking-tighter flex items-center gap-2">
      <!-- A little music icon -->
      <svg class="w-6 h-6 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
      HIDDEN GEMS
    </div>
    <div class="hidden md:flex gap-8 text-sm text-gray-400 font-medium">
      <a href="#" class="hover:text-white transition">Discover</a>
      <a href="#" class="hover:text-white transition">Library</a>
      <a href="#" class="hover:text-white transition">Pricing</a>
    </div>
    <button class="px-5 py-2 rounded-full border border-white/20 text-sm font-medium hover:bg-white/10 transition backdrop-blur-sm">
      Log In
    </button>
  </nav>

  <!-- Main Hero Content -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 relative z-10 mt-[-50px]">
    
    <span class="px-3 py-1 text-xs font-semibold tracking-wider text-purple-300 uppercase bg-purple-900/30 rounded-full border border-purple-500/30 mb-8 backdrop-blur-sm">
      The anti-algorithm music engine
    </span>

    <h1 class="text-5xl md:text-7xl font-bold max-w-4xl tracking-tight leading-tight mb-6">
      Find the music <br />
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500">
        algorithms hide from you.
      </span>
    </h1>

    <p class="text-gray-400 text-lg md:text-xl max-w-2xl mb-10">
      Curated deep cuts, underground vibes, and tracks you won't hear on the radio. Paste a vibe, get a playlist.
    </p>

    <!-- The Button to trigger the JS -->
    <div class="flex flex-col sm:flex-row gap-4">
      <button id="spin-btn" onclick="generatePlaylist()" class="px-8 py-3 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
        Generate Hidden Gems
      </button>
    </div>

    <!-- The Results Box (Hidden by default) -->
    <div id="result-view" class="hidden mt-12 w-full max-w-2xl backdrop-blur-xl bg-white/5 border border-white/10 rounded-2xl p-6 text-left">
      <h2 class="text-xl font-semibold mb-4 text-white">Your 5 Hidden Gems:</h2>
      <ul id="song-list" class="space-y-2 text-gray-300">
        <!-- Songs go here -->
      </ul>
    </div>

  </main>

  <!-- Script for the 3D background (Vanta.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>
  <script>
    // Initialize the 3D wave background
    VANTA.TOPOLOGY({
      el: "#canvas-container",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0x4c1d95, /* Deep purple color */
      backgroundColor: 0x000000
    })
  </script>

  <!-- Script for the Song Generator -->
  <script>
    const songs = [
      "Men I Trust - Show Me How",
      "Crumb - Locket",
      "Mac DeMarco - Chamber of Reflection",
      "Cigarettes After Sex - Apocalypse",
      "Beach House - Space Song",
      "Vansire - Halcyon Age",
      "Tame Impala - Yes I'm Changing",
      "Mild High Club - Homage"
    ];

    function generatePlaylist() {
      document.getElementById('result-view').classList.remove('hidden');
      const btn = document.getElementById('spin-btn');
      btn.innerText = "Shuffle Again";
      
      const listContainer = document.getElementById('song-list');
      listContainer.innerHTML = ''; 

      const shuffled = [...songs].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 5);

      selected.forEach(song => {
        const li = document.createElement('li');
        li.className = "p-3 bg-white/5 border border-white/10 rounded-lg hover:bg-white/10 transition flex items-center gap-3";
        li.innerHTML = `<span class="text-purple-400">▶</span> ${song}`;
        listContainer.appendChild(li);
      });
    }
  </script>

</body>
</html>
